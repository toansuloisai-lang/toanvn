name: toanvn
services:
  database:
    image: ${TOANVN_POSTGRES_IMAGE:-local/toanvn-postgres-security:20261031}
    build:
      context: ./postgres-security
    container_name: toanvn-db
    restart: unless-stopped
    # Database has no network interface and no published port. Only the app
    # shares its Unix socket; reject all host authentication as defense in depth.
    network_mode: none
    environment:
      POSTGRES_USER: mathlab
      POSTGRES_DB: mathlab
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=reject
    command: ["postgres", "-c", "listen_addresses=", "-c", "unix_socket_permissions=0777"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U mathlab -d mathlab"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: ${TOANVN_IMAGE:-toanvn:9ad0d61}
    build:
      context: ../..
      dockerfile: deploy/node1/Dockerfile
    container_name: toanvn
    restart: unless-stopped
    init: true
    command: ["node", "scripts/start-vps.mjs"]
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ${TOANVN_ENV_FILE:-/opt/toanvn/.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      COOKIE_SECURE: "true"
      MATH_STORAGE: postgres
      DATABASE_SOCKET_DIR: /var/run/postgresql
      DATABASE_NAME: mathlab
      DATABASE_USER: mathlab
      TRUSTED_PROXY_IPS: 172.20.0.14
    ports:
      - "127.0.0.1:3060:3000"
    volumes:
      - /opt/toanvn/private:/app/private
      - postgres-socket:/var/run/postgresql:ro
    networks:
      - proxy
    mem_limit: 1024m
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: nginx-manager_default
volumes:
  postgres-data:
  postgres-socket:
