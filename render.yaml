services:
  - type: web
    name: math-thinking-lab
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run build:deploy
    startCommand: npm run start:render
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: MATH_STORAGE
        value: supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: GMAIL_TRANSPORT
        value: api
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
